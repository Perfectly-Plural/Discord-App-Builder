name: Build Linux Release

on:
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: linux-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build and upload Linux packages
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: Windows

    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Windows/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Verify desktop application
        run: |
          npm run typecheck
          npm test

      - name: Build Linux packages
        run: npm run build:linux

      - name: Verify package artifacts
        run: |
          mapfile -t appimages < <(find dist -maxdepth 1 -name 'Discord-App-Builder-Linux-*.AppImage' -type f)
          mapfile -t debs < <(find dist -maxdepth 1 -name 'Discord-App-Builder-Linux-*.deb' -type f)
          test "${#appimages[@]}" -eq 2
          test "${#debs[@]}" -eq 2
          for artifact in "${appimages[@]}" "${debs[@]}"; do
            test "$(stat -c%s "$artifact")" -gt 10000000
          done
          chmod +x "${appimages[@]}"

      - name: Upload packages to release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            Windows/dist/Discord-App-Builder-Linux-*.AppImage \
            Windows/dist/Discord-App-Builder-Linux-*.deb \
            --clobber
