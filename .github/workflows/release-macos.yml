name: Build macOS Release

on:
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build and upload macOS app
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Run tests
        run: xcrun swift test

      - name: Build app bundle
        run: Scripts/package-app.sh

      - name: Verify app bundle
        run: |
          codesign --verify --deep --strict --verbose=2 "dist/Discord App Builder.app"
          test -x "dist/Discord App Builder.app/Contents/MacOS/DiscordAppBuilder"

      - name: Create app-only archive
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/Discord App Builder.app" \
            "dist/Discord-App-Builder-macOS.zip"

      - name: Upload app to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "dist/Discord-App-Builder-macOS.zip#Discord App Builder for macOS" \
            --clobber
